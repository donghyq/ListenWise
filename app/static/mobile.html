<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="声息" />
<link rel="apple-touch-icon" href="/m/icon-180.png" />
<title>声息 · 手机收听</title>
<style>
:root { --ink: #14251f; --muted: #6b766f; --accent: #1d5b49; --line: #e6e1d5; --bg: #f7f5ef; --card: #fffdf8; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Noto Sans SC", "PingFang SC", sans-serif; padding-bottom: calc(96px + env(safe-area-inset-bottom)); }
header { padding: calc(18px + env(safe-area-inset-top)) 18px 14px; border-bottom: 1px solid var(--line); background: var(--card); }
header .brand { font-size: 12px; letter-spacing: .18em; color: var(--accent); font-weight: 600; }
header h1 { margin: 4px 0 2px; font-size: 21px; line-height: 1.35; }
header .meta { color: var(--muted); font-size: 13px; }
header .dl-all { margin-top: 10px; }
header .dl-all button { width: 100%; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 10px; padding: 10px 14px; font-size: 14px; font-weight: 600; }
header .dl-all button:active { background: var(--line); }
header .dl-all button + button { margin-top: 8px; }
header .dl-all button.cached { color: var(--accent); border-color: var(--accent); }
header .dl-all .hint { color: var(--muted); font-size: 12px; margin-top: 6px; display: none; }
.offline { padding: 8px 18px; background: #f3ecd7; color: #7a5b18; font-size: 13px; }
main { padding: 12px 14px; display: grid; gap: 10px; }
.chapter { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 13px 14px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; cursor: pointer; }
.chapter:active { background: #f1eee4; }
.chapter.playing { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(29,91,73,.12); }
.chapter .num { width: 34px; height: 34px; border-radius: 10px; background: #eceadf; color: var(--muted); display: grid; place-items: center; font-weight: 600; font-size: 14px; }
.chapter.playing .num { background: var(--accent); color: #fff; }
.chapter .info { min-width: 0; }
.chapter .title { font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chapter .sub { color: var(--muted); font-size: 12px; display: flex; gap: 8px; align-items: center; margin-top: 2px; }
.chapter .bar { height: 3px; margin-top: 7px; border-radius: 99px; background: var(--line); overflow: hidden; }
.chapter .bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 99px; }
.chip { font-size: 11px; padding: 1px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
.chip.done { background: var(--accent); border-color: var(--accent); color: #fff; }
.chip.cached { color: var(--accent); border-color: var(--accent); }
.learn-btn { border: 0; background: none; color: var(--muted); font-size: 12px; padding: 6px 2px; }
.learn-btn.done { color: var(--accent); font-weight: 600; }
.player { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line); padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); }
.player .row { display: flex; align-items: center; gap: 8px; }
.player .row.controls { justify-content: center; gap: 18px; margin-top: 4px; }
.player .now { min-width: 0; flex: 1; }
.player .now b { display: block; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.player .now small { color: var(--muted); font-size: 12px; }
.player button { border: 0; background: none; font-size: 22px; color: var(--ink); padding: 8px; }
.player .play { width: 52px; height: 52px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 24px; }
.player .step { font-size: 13px; font-weight: 600; color: var(--accent); min-width: 44px; padding: 8px 2px; }
.player .speed { font-size: 13px; color: var(--accent); font-weight: 600; }
.player .transcript-btn { font-size: 13px; color: var(--muted); font-weight: 600; }
.player .transcript-btn.open { color: var(--accent); }
.player .seek { width: 100%; margin-top: 8px; accent-color: var(--accent); }
.player .transcript { display: none; max-height: 36vh; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 12px 4px; margin-top: 8px; border-top: 1px solid var(--line); white-space: pre-wrap; font-size: 15px; line-height: 1.9; color: #2c3a33; }
.player .transcript.open { display: block; }
.empty { text-align: center; color: var(--muted); padding: 48px 24px; }
.error { text-align: center; padding: 64px 24px; color: var(--muted); }
.error b { display: block; font-size: 18px; color: var(--ink); margin-bottom: 8px; }
a.dl { color: var(--muted); font-size: 12px; text-decoration: none; }
</style>
</head>
<body>
<header>
  <div class="brand">声息 · SHENGXI</div>
  <h1 id="book-title">加载中…</h1>
  <div class="meta" id="book-meta"></div>
  <div class="dl-all" id="dl-all" hidden>
    <button id="cache-btn">☁ 离线缓存（电脑关机也能听）</button>
    <button id="dl-all-btn">⬇ 下载全部（MP3 + 讲稿）</button>
    <div class="hint" id="dl-all-hint"></div>
  </div>
</header>
<div class="offline" id="offline" hidden>离线模式 · 用手机缓存的内容收听，学习标记会在重新连接电脑后同步</div>
<main id="list"><div class="empty">正在获取章节…</div></main>
<div class="player" id="player" hidden>
  <input class="seek" id="seek" type="range" min="0" max="1000" value="0" />
  <div class="row controls">
    <button id="prev" aria-label="上一章">⏮</button>
    <button class="step" id="back" aria-label="后退15秒">−15s</button>
    <button class="play" id="play" aria-label="播放">▶</button>
    <button class="step" id="fwd" aria-label="快进15秒">+15s</button>
    <button id="next" aria-label="下一章">⏭</button>
  </div>
  <div class="row">
    <div class="now"><b id="now-title"></b><small id="now-time">--:-- / --:--</small></div>
    <button class="speed" id="speed">1.0×</button>
    <button class="transcript-btn" id="transcript-btn">文稿</button>
    <a class="dl" id="dl" download>下载</a>
  </div>
  <div class="transcript" id="transcript"></div>
  <audio id="audio" preload="metadata" playsinline></audio>
</div>
<script>
(function () {
  'use strict';
  var token = decodeURIComponent(location.pathname.split('/')[2] || '');
  var api = '/m/' + encodeURIComponent(token);
  var audio = document.getElementById('audio');
  var chapters = [];
  var current = -1;
  var speeds = [1, 1.25, 1.5, 2];
  var speedIndex = 0;
  var pendingSeek = 0;
  var seeking = false;
  var lastUserScroll = 0;
  var offlineMode = false;
  var cachedIds = {};
  var objectURL = null;

  // ---- IndexedDB 离线缓存（局域网 HTTP 无法用 Service Worker，改用 IDB 存音频与书目）----
  var dbPromise = null;
  function openDB() {
    if (!dbPromise) {
      if (!('indexedDB' in window)) { dbPromise = Promise.reject(new Error('unsupported')); return dbPromise; }
      dbPromise = new Promise(function (resolve, reject) {
        var req = indexedDB.open('sx-listen', 1);
        req.onupgradeneeded = function () {
          var db = req.result;
          if (!db.objectStoreNames.contains('book')) db.createObjectStore('book');
          if (!db.objectStoreNames.contains('audio')) db.createObjectStore('audio');
        };
        req.onsuccess = function () { resolve(req.result); };
        req.onerror = function () { reject(req.error || new Error('idb error')); };
      });
    }
    return dbPromise;
  }
  function idbGet(store, key) {
    return openDB().then(function (db) {
      return new Promise(function (resolve, reject) {
        var get = db.transaction(store, 'readonly').objectStore(store).get(key);
        get.onsuccess = function () { resolve(get.result); };
        get.onerror = function () { reject(get.error); };
      });
    });
  }
  function idbPut(store, key, value) {
    return openDB().then(function (db) {
      return new Promise(function (resolve, reject) {
        var put = db.transaction(store, 'readwrite').objectStore(store).put(value, key);
        put.onsuccess = function () { resolve(); };
        put.onerror = function () { reject(put.error); };
      });
    });
  }
  function loadCachedFlags() {
    return openDB().then(function (db) {
      return new Promise(function (resolve) {
        try {
          var cursor = db.transaction('audio', 'readonly').objectStore('audio').openCursor();
          cursor.onsuccess = function () {
            var row = cursor.result;
            if (row) { cachedIds[row.key] = true; row.continue(); } else resolve();
          };
          cursor.onerror = function () { resolve(); };
        } catch (error) { resolve(); }
      });
    }).catch(function () {});
  }
  function cacheAudio(ch) {
    if (cachedIds[ch.id]) return Promise.resolve(true);
    cachedIds[ch.id] = true;
    return fetch(api + '/audio/' + encodeURIComponent(ch.id)).then(function (res) {
      if (!res.ok) throw new Error('fetch fail');
      return res.blob();
    }).then(function (blob) {
      return idbPut('audio', ch.id, blob);
    }).then(function () {
      renderList(); if (current >= 0) refreshRow(current);
      return true;
    }).catch(function () {
      delete cachedIds[ch.id];
      return false;
    });
  }
  function resolveAudio(ch) {
    return idbGet('audio', ch.id).then(function (blob) {
      if (blob) {
        cachedIds[ch.id] = true;
        if (objectURL) URL.revokeObjectURL(objectURL);
        objectURL = URL.createObjectURL(blob);
        return objectURL;
      }
      if (offlineMode) return '';
      cacheAudio(ch);
      return api + '/audio/' + encodeURIComponent(ch.id);
    }).catch(function () {
      return offlineMode ? '' : api + '/audio/' + encodeURIComponent(ch.id);
    });
  }

  function posKey(id) { return 'sx-pos:' + token + ':' + id; }
  function fmt(sec) {
    if (!isFinite(sec)) return '--:--';
    sec = Math.max(0, Math.round(sec));
    return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
  }
  function $(id) { return document.getElementById(id); }

  function renderList() {
    var list = $('list');
    if (!chapters.length) { list.innerHTML = '<div class="empty">这本书还没有已合成的音频。<br/>回到电脑端「音频与导出」先生成。</div>'; return; }
    list.innerHTML = '';
    chapters.forEach(function (ch, index) {
      var pos = Number(localStorage.getItem(posKey(ch.id)) || 0);
      var pct = ch.duration_seconds ? Math.min(100, Math.round(pos / ch.duration_seconds * 100)) : 0;
      var row = document.createElement('div');
      row.className = 'chapter' + (index === current ? ' playing' : '');
      row.dataset.index = index;
      row.innerHTML = '<div class="num">' + (index + 1) + '</div>' +
        '<div class="info"><div class="title"></div><div class="sub"><span>' + fmt(ch.duration_seconds) + '</span>' +
        (ch.chapter ? '' : '<span class="chip">整篇</span>') +
        (cachedIds[ch.id] ? '<span class="chip cached">已缓存</span>' : '') +
        '<span class="chip' + (ch.learned ? ' done' : '') + '" data-learn>' + (ch.learned ? '已学' : '未学') + '</span></div>' +
        '<div class="bar"><i style="width:' + pct + '%"></i></div></div>' +
        '<button class="learn-btn' + (ch.learned ? ' done' : '') + '" data-learn-btn>' + (ch.learned ? '✓ 已学' : '标记已学') + '</button>';
      row.querySelector('.title').textContent = ch.title;
      row.addEventListener('click', function (event) {
        if (event.target.hasAttribute('data-learn-btn')) return;
        play(index);
      });
      row.querySelector('[data-learn-btn]').addEventListener('click', function () { toggleLearn(index); });
      list.appendChild(row);
    });
  }

  function refreshRow(index) {
    var rows = document.querySelectorAll('.chapter');
    if (rows[index]) rows[index].classList.toggle('playing', index === current);
  }

  function applySeek(sec) {
    // iOS Safari：媒体未加载完（readyState 低）时设置 currentTime 会被静默忽略，
    // 这里先记下待跳转位置，等 loadedmetadata 后再应用。
    if (audio.readyState >= 1 && isFinite(audio.duration) && audio.duration > 0) {
      try { audio.currentTime = Math.min(Math.max(0, sec), audio.duration - 0.5); } catch (error) { pendingSeek = sec; }
    } else {
      pendingSeek = sec;
    }
  }

  function play(index) {
    if (index < 0 || index >= chapters.length) return;
    var ch = chapters[index];
    current = index;
    var resume = Number(localStorage.getItem(posKey(ch.id)) || 0);
    var rate = speeds[speedIndex];
    resolveAudio(ch).then(function (url) {
      if (current !== index) return;
      if (!url) { $('now-time').textContent = '本章未缓存 · 需连接电脑后播放'; return; }
      audio.src = url;
      audio.playbackRate = rate;
      if (resume > 2 && (!ch.duration_seconds || resume < ch.duration_seconds - 3)) applySeek(resume);
      audio.play().catch(function () {});
    });
    $('now-title').textContent = (index + 1) + '. ' + ch.title;
    $('dl').hidden = offlineMode;
    $('dl').href = api + '/audio/' + encodeURIComponent(ch.id) + '?download=1';
    var transcript = $('transcript');
    transcript.textContent = ch.text || '这一章暂时没有配套文稿。';
    transcript.scrollTop = 0;
    var hasText = Boolean(ch.text);
    $('transcript-btn').hidden = !hasText;
    transcript.classList.toggle('open', hasText);
    $('transcript-btn').classList.toggle('open', hasText);
    document.querySelectorAll('.chapter').forEach(function (row, i) { row.classList.toggle('playing', i === index); });
    if ('mediaSession' in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({ title: ch.title, artist: $('book-title').textContent, album: '声息' });
    }
  }

  function markLearned(index, value) {
    var ch = chapters[index];
    ch.learned = value;
    renderList();
    if (current >= 0) refreshRow(current);
  }

  function queueProgress(ch, completed) {
    var queue = [];
    try { queue = JSON.parse(localStorage.getItem('sx-queue:' + token) || '[]'); } catch (error) {}
    queue = queue.filter(function (item) { return item.audio_id !== ch.id; });
    queue.push({ audio_id: ch.id, completed: completed });
    localStorage.setItem('sx-queue:' + token, JSON.stringify(queue));
  }

  function flushQueue() {
    var raw = localStorage.getItem('sx-queue:' + token);
    if (!raw) return;
    var queue;
    try { queue = JSON.parse(raw); } catch (error) { return; }
    if (!queue.length) return;
    Promise.all(queue.map(function (item) {
      return fetch(api + '/progress', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(item) })
        .then(function (res) { if (!res.ok) throw new Error('bad'); });
    })).then(function () {
      localStorage.removeItem('sx-queue:' + token);
      $('offline').hidden = true;
    }).catch(function () {});
  }
  window.addEventListener('online', flushQueue);
  window.addEventListener('pageshow', flushQueue);
  function updateOfflineBanner() {
    if (navigator.onLine) {
      if (!offlineMode) $('offline').hidden = true;
      return;
    }
    $('offline').textContent = '网络已断开 · 正在播放手机缓存的内容，学习标记联网后自动同步';
    $('offline').hidden = false;
  }
  window.addEventListener('offline', updateOfflineBanner);
  window.addEventListener('online', updateOfflineBanner);
  updateOfflineBanner();

  function toggleLearn(index) {
    var ch = chapters[index];
    var target = !ch.learned;
    fetch(api + '/progress', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ audio_id: ch.id, completed: target }) })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (data.saved) markLearned(index, target);
      })
      .catch(function () {
        // 离线：本地先生效并入队，连回电脑后自动同步
        markLearned(index, target);
        queueProgress(ch, target);
      });
  }

  function step(delta) {
    if (!chapters.length) return;
    var next = (current + delta + chapters.length) % chapters.length;
    play(next);
  }

  function applyData(data) {
    $('book-title').textContent = data.title;
    var meta = [];
    if (data.total) meta.push('已学 ' + data.learned_count + ' / ' + data.total + ' 章');
    meta.push(data.whole_book.length ? '含整篇音频' : '共 ' + data.total + ' 章');
    if (offlineMode) meta.push('离线');
    $('book-meta').textContent = meta.join(' · ');
    chapters = data.chapters.concat(data.whole_book);
    loadCachedFlags().then(function () {
      renderList();
      if (chapters.length) {
        $('player').hidden = false;
        current = -1;
        $('dl-all').hidden = false;
        var cachedCount = chapters.filter(function (ch) { return cachedIds[ch.id]; }).length;
        $('cache-btn').textContent = '☁ 离线缓存（' + cachedCount + ' / ' + chapters.length + ' 章）';
        if (offlineMode) $('dl-all-btn').hidden = true;
        else {
          var total = data.chapters.length || data.whole_book.length;
          $('dl-all-btn').textContent = '⬇ 下载全部（' + total + ' 章 MP3 + 讲稿）';
        }
      }
    });
  }

  fetch(api + '/data').then(function (res) {
    if (!res.ok) throw new Error('链接已失效');
    return res.json();
  }).then(function (data) {
    flushQueue();
    idbPut('book', token, data).catch(function () {});
    applyData(data);
  }).catch(function () {
    // 电脑不在线：尝试用手机里缓存的书目继续（页面壳已加载时仍可播放已缓存章节）
    idbGet('book', token).then(function (data) {
      if (!data) throw new Error('no cache');
      offlineMode = true;
      $('offline').hidden = false;
      applyData(data);
    }).catch(function () {
      $('list').innerHTML = '<div class="error"><b>无法打开</b>链接不存在、已过期或已被吊销；或电脑不在线且手机上没有缓存这本书。请回到电脑端重新生成二维码。</div>';
    });
  });

  $('cache-btn').addEventListener('click', function () {
    var btn = $('cache-btn');
    var hint = $('dl-all-hint');
    var todo = chapters.filter(function (ch) { return !cachedIds[ch.id]; });
    hint.style.display = 'block';
    if (!todo.length) {
      btn.classList.add('cached');
      hint.textContent = '✓ 全部章节都已缓存在手机上，电脑关机也不影响收听。';
      return;
    }
    btn.disabled = true;
    hint.textContent = '正在把章节音频存到手机，章节越多耗时越长，请勿锁屏。';
    var fail = 0;
    var done = 0;
    var total = todo.length;
    function next() {
      if (!todo.length) {
        btn.disabled = false;
        btn.classList.add('cached');
        btn.textContent = '☁ 离线缓存（' + (chapters.length - fail) + ' / ' + chapters.length + ' 章）';
        hint.textContent = fail
          ? '有 ' + fail + ' 章缓存失败，可稍后再点一次补齐。'
          : '✓ 已全部缓存。注意：重新打开页面时仍需声息在线加载页面本身，之后播放、文稿、标记都走手机缓存。';
        return;
      }
      var ch = todo.shift();
      cacheAudio(ch).then(function (ok) {
        if (!ok) fail++;
        done++;
        btn.textContent = '☁ 缓存中… ' + done + ' / ' + total;
        next();
      });
    }
    next();
  });

  $('dl-all-btn').addEventListener('click', function () {
    var btn = $('dl-all-btn');
    var hint = $('dl-all-hint');
    btn.disabled = true;
    btn.textContent = '正在打包…';
    hint.style.display = 'block';
    hint.textContent = '正在把整本书打包成 ZIP，章节越多耗时越长，请勿锁屏。';
    // 用 fetch + blob 触发下载，便于展示进度与错误；Safari 会弹「下载」确认。
    fetch(api + '/download').then(function (res) {
      if (!res.ok) throw new Error('打包失败');
      return res.blob();
    }).then(function (blob) {
      var link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = ($('book-title').textContent || '声息') + '.zip';
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(function () { URL.revokeObjectURL(link.href); }, 30000);
      btn.textContent = '✓ 已开始下载，可在「文件」App 的「下载」里查看';
      hint.textContent = '解压后可用任意播放器离线收听；讲稿在同目录的 TXT 里。';
    }).catch(function () {
      btn.textContent = '⬇ 下载全部（MP3 + 讲稿）';
      btn.disabled = false;
      hint.textContent = '下载失败，请确认声息在电脑上仍在运行，再试一次。';
    });
  });

  $('play').addEventListener('click', function () {
    if (current < 0) { play(0); return; }
    if (audio.paused) audio.play().catch(function () {}); else audio.pause();
  });
  audio.addEventListener('play', function () { $('play').textContent = '⏸'; });
  audio.addEventListener('pause', function () { $('play').textContent = '▶'; });
  audio.addEventListener('ended', function () {
    if (current < chapters.length - 1) play(current + 1);
  });
  $('prev').addEventListener('click', function () { step(-1); });
  $('next').addEventListener('click', function () { step(1); });
  $('speed').addEventListener('click', function () {
    speedIndex = (speedIndex + 1) % speeds.length;
    audio.playbackRate = speeds[speedIndex];
    $('speed').textContent = speeds[speedIndex].toFixed(speeds[speedIndex] % 1 ? 2 : 1).replace(/0$/, '') + '×';
    localStorage.setItem('sx-speed', String(speedIndex));
  });
  var savedSpeed = Number(localStorage.getItem('sx-speed') || 0);
  if (savedSpeed > 0 && savedSpeed < speeds.length) { speedIndex = savedSpeed; audio.playbackRate = speeds[speedIndex]; $('speed').textContent = speeds[speedIndex] + '×'; }

  var lastSave = 0;
  var lastSync = 0;
  audio.addEventListener('loadedmetadata', function () {
    if (pendingSeek > 0) { applySeek(pendingSeek); pendingSeek = 0; }
  });
  audio.addEventListener('timeupdate', function () {
    if (current < 0) return;
    var ch = chapters[current];
    $('now-time').textContent = fmt(audio.currentTime) + ' / ' + fmt(audio.duration || ch.duration_seconds);
    if (!seeking) $('seek').value = audio.duration ? String(Math.round(audio.currentTime / audio.duration * 1000)) : '0';
    var now = Date.now();
    if (now - lastSave > 3000) {
      lastSave = now;
      localStorage.setItem(posKey(ch.id), String(audio.currentTime));
      var rows = document.querySelectorAll('.chapter');
      if (rows[current]) {
        var pct = ch.duration_seconds ? Math.min(100, Math.round(audio.currentTime / ch.duration_seconds * 100)) : 0;
        var bar = rows[current].querySelector('.bar i');
        if (bar) bar.style.width = pct + '%';
      }
    }
    // 文稿随播放滚动（用户手动翻阅后 4 秒内不抢滚动位置）
    var transcript = $('transcript');
    if (transcript.classList.contains('open') && now - lastSync > 400 && now - lastUserScroll > 4000 && isFinite(audio.duration) && audio.duration > 0) {
      lastSync = now;
      var range = transcript.scrollHeight - transcript.clientHeight;
      transcript.scrollTop = range * (audio.currentTime / audio.duration);
    }
  });
  $('seek').addEventListener('input', function () {
    seeking = true;
    var duration = audio.duration;
    if (isFinite(duration) && duration > 0) {
      var target = Number($('seek').value) / 1000 * duration;
      applySeek(target);
      $('now-time').textContent = fmt(target) + ' / ' + fmt(duration);
    }
  });
  function endSeek() { seeking = false; }
  $('seek').addEventListener('change', endSeek);
  $('seek').addEventListener('touchend', endSeek);
  $('seek').addEventListener('pointerup', endSeek);
  $('back').addEventListener('click', function () { applySeek(audio.currentTime - 15); });
  $('fwd').addEventListener('click', function () { applySeek(audio.currentTime + 15); });
  $('transcript-btn').addEventListener('click', function () {
    var transcript = $('transcript');
    var open = transcript.classList.toggle('open');
    $('transcript-btn').classList.toggle('open', open);
  });
  ['touchstart', 'wheel'].forEach(function (name) {
    $('transcript').addEventListener(name, function () { lastUserScroll = Date.now(); }, { passive: true });
  });

  if ('mediaSession' in navigator) {
    navigator.mediaSession.setActionHandler('previoustrack', function () { step(-1); });
    navigator.mediaSession.setActionHandler('nexttrack', function () { step(1); });
    navigator.mediaSession.setActionHandler('play', function () { audio.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { audio.pause(); });
    try { navigator.mediaSession.setActionHandler('seekto', function (details) { applySeek(details.seekTime || 0); }); } catch (error) {}
    try { navigator.mediaSession.setActionHandler('seekforward', function (details) { applySeek(audio.currentTime + (details.seekOffset || 15)); }); } catch (error) {}
    try { navigator.mediaSession.setActionHandler('seekbackward', function (details) { applySeek(audio.currentTime - (details.seekOffset || 15)); }); } catch (error) {}
  }
})();
</script>
</body>
</html>
