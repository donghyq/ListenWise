name: Build and release Windows desktop app

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to upload assets to (e.g. v0.1.2)"
        required: false
        default: "v0.1.2"
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Prepare bundled FFmpeg for Windows package
        shell: pwsh
        run: |
          $ff = Get-Command ffmpeg -ErrorAction SilentlyContinue
          if (-not $ff) {
            choco install ffmpeg -y --no-progress
            $ff = Get-Command ffmpeg -ErrorAction Stop
          }
          $ffDir = Split-Path -Parent $ff.Source
          New-Item -ItemType Directory -Force -Path "tools\ffmpeg\bin" | Out-Null
          Copy-Item (Join-Path $ffDir "ffmpeg.exe") "tools\ffmpeg\bin\ffmpeg.exe" -Force
          if (Test-Path (Join-Path $ffDir "ffprobe.exe")) {
            Copy-Item (Join-Path $ffDir "ffprobe.exe") "tools\ffmpeg\bin\ffprobe.exe" -Force
          }
      - name: Build Windows zip package
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts\build_windows_app.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: shengxi-win64
          path: |
            dist/Shengxi-*-win64.zip
            dist/Shengxi-*-win64.zip.sha256
          if-no-files-found: error
      - name: Upload to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ github.event.inputs.release_tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $tag = if ($env:INPUT_TAG) { $env:INPUT_TAG } elseif ($env:REF_NAME -like "v*") { $env:REF_NAME } else { "v0.1.2" }
          $files = Get-ChildItem dist\Shengxi-*-win64.zip* | ForEach-Object { $_.FullName }
          gh release view $tag --repo ${{ github.repository }} 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $files --clobber --repo ${{ github.repository }}
          }
